services:
  - type: web
    name: buscaya-whatsapp-backend
    env: node
    plan: free
    region: ohio
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: GEMINI_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: AI_MODEL
        value: gemini-1.5-pro
      - key: ALLOWED_ORIGINS
        value: "*"
    disk:
      name: whatsapp-session-data
      mountPath: /opt/render/project/src/auth_info_baileys
      sizeGB: 1
